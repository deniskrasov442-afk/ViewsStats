<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewsStats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-4">
    <div class="max-w-md mx-auto space-y-4">
        <!-- Шапка -->
        <div class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700">
            <div>
                <h1 class="text-lg font-bold">Аналитика каналов</h1>
                <p class="text-xs text-gray-400">YouTube / TikTok / Facebook</p>
            </div>
            <button id="authBtn" type="button" onclick="handleAuth()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer">
                Войти в Google
            </button>
        </div>

        <!-- Вкладки -->
        <div class="flex bg-gray-800 p-1 rounded-xl border border-gray-700 text-sm">
            <button type="button" onclick="switchTab('yt')" id="tab-yt" class="flex-1 py-2 rounded-lg bg-red-600 font-semibold">YouTube</button>
            <button type="button" onclick="switchTab('tt')" id="tab-tt" class="flex-1 py-2 rounded-lg text-gray-400">TikTok</button>
            <button type="button" onclick="switchTab('fb')" id="tab-fb" class="flex-1 py-2 rounded-lg text-gray-400">Facebook</button>
        </div>

        <!-- Контент YouTube -->
        <div id="content-yt" class="space-y-4">
            <div class="flex gap-2">
                <input type="text" id="ytChannelInput" placeholder="@handle (например @sputn1k_1)" class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-red-500">
                <button type="button" onclick="searchYtChannel()" class="bg-red-600 px-4 py-2 rounded-xl text-sm font-semibold">Найти</button>
            </div>

            <!-- Карточка канала -->
            <div id="ytCard" class="hidden bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
                <div class="flex items-center gap-3">
                    <img id="ytAvatar" class="w-12 h-12 rounded-full border border-gray-600" src="" alt="Avatar">
                    <div>
                        <h2 id="ytTitle" class="font-bold text-base"></h2>
                        <p id="ytCustomUrl" class="text-xs text-gray-400"></p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <div class="bg-gray-900 p-2 rounded-lg">
                        <div class="text-gray-400">Подписчики</div>
                        <div id="ytSubs" class="font-bold text-sm text-red-400">0</div>
                    </div>
                    <div class="bg-gray-900 p-2 rounded-lg">
                        <div class="text-gray-400">Просмотры</div>
                        <div id="ytViews" class="font-bold text-sm">0</div>
                    </div>
                    <div class="bg-gray-900 p-2 rounded-lg">
                        <div class="text-gray-400">Видео</div>
                        <div id="ytVideos" class="font-bold text-sm">0</div>
                    </div>
                </div>

                <div id="revenueBlock" class="hidden bg-gray-900 p-3 rounded-lg border border-green-500/30">
                    <div class="text-xs text-gray-400">Доход (за последние 30 дней)</div>
                    <div id="revenueValue" class="text-lg font-bold text-green-400">$0.00</div>
                </div>
            </div>
        </div>

        <!-- Контент TikTok -->
        <div id="content-tt" class="hidden space-y-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
                <h3 class="font-bold text-sm">TikTok Профиль</h3>
                <input type="text" id="ttUsername" placeholder="@username" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm">
                <button type="button" onclick="alert('TikTok профиль сохранён!')" class="w-full bg-red-600 py-2 rounded-lg text-xs font-semibold">Сохранить</button>
            </div>
        </div>

        <!-- Контент Facebook -->
        <div id="content-fb" class="hidden space-y-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
                <h3 class="font-bold text-sm">Facebook Страница</h3>
                <input type="text" id="fbPageId" placeholder="Page ID или URL" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm">
                <button type="button" onclick="alert('Facebook страница сохранена!')" class="w-full bg-red-600 py-2 rounded-lg text-xs font-semibold">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '443708504279-3vojcefjp9isvrk4fa9kevqujdq9o40i.apps.googleusercontent.com';
        let accessToken = null;

        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch(e) {}

        function switchTab(tab) {
            ['yt', 'tt', 'fb'].forEach(t => {
                document.getElementById(`content-${t}`)?.classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                if (btn) btn.className = 'flex-1 py-2 rounded-lg text-gray-400';
            });
            document.getElementById(`content-${tab}`)?.classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) activeBtn.className = 'flex-1 py-2 rounded-lg bg-red-600 font-semibold';
        }

        function handleAuth() {
            const redirectUri = 'https://deniskrasov442-afk.github.io/ViewsStats/';
            const scope = 'https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly';
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${encodeURIComponent(scope)}`;
            
            // Пробуем запустить прямо в текущем окне, чтобы редирект возвращал прямо на страницу
            window.location.href = authUrl;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token=')) {
                const params = new URLSearchParams(hash.replace('#', '?'));
                accessToken = params.get('access_token');
                if (accessToken) {
                    const btn = document.getElementById('authBtn');
                    if (btn) {
                        btn.innerText = 'Авторизован';
                        btn.className = 'bg-green-600 px-3 py-1.5 rounded-lg text-xs font-semibold';
                    }
                    loadMyYtChannel();
                    history.replaceState(null, null, window.location.pathname);
                }
            }
        });

        // Загрузка ЛИЧНОГО канала авторизованного пользователя через Google API
        async function loadMyYtChannel() {
            if (!accessToken) return;
            try {
                const res = await fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&mine=true', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.json();
                
                if (data.items && data.items.length > 0) {
                    const ch = data.items[0];
                    showChannelData(
                        ch.snippet.title,
                        ch.snippet.customUrl || ch.id,
                        ch.snippet.thumbnails.default.url,
                        ch.statistics.subscriberCount,
                        ch.statistics.viewCount,
                        ch.statistics.videoCount
                    );
                    loadRevenue();
                } else {
                    alert('У вашего аккаунта Google не найден YouTube канал.');
                }
            } catch (e) {
                console.error('Ошибка загрузки личного канала:', e);
            }
        }

        // Вывод данных канала в интерфейс
        function showChannelData(title, handle, avatar, subs, views, videos) {
            document.getElementById('ytCard').classList.remove('hidden');
            document.getElementById('ytTitle').innerText = title;
            document.getElementById('ytCustomUrl').innerText = handle;
            document.getElementById('ytAvatar').src = avatar;
            document.getElementById('ytSubs').innerText = Number(subs).toLocaleString();
            document.getElementById('ytViews').innerText = Number(views).toLocaleString();
            document.getElementById('ytVideos').innerText = Number(videos).toLocaleString();
        }

        // Загрузка дохода за 30 дней
        async function loadRevenue() {
            if (!accessToken) return;
            try {
                const now = new Date();
                const endDate = now.toISOString().split('T')[0];
                const startDate = new Date(now.setDate(now.getDate() - 30)).toISOString().split('T')[0];

                const res = await fetch(`https://youtubeanalytics.googleapis.com/v2/reports?startDate=${startDate}&endDate=${endDate}&metrics=estimatedRevenue&ids=channel==MINE`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.json();
                if (data.rows && data.rows.length > 0) {
                    const rev = data.rows.reduce((sum, r) => sum + r[0], 0);
                    document.getElementById('revenueValue').innerText = `$${rev.toFixed(2)}`;
                    document.getElementById('revenueBlock').classList.remove('hidden');
                }
            } catch (e) {
                console.error('Ошибка дохода:', e);
            }
        }

        // Поиск любого канала по нику
        async function searchYtChannel() {
            const handle = document.getElementById('ytChannelInput').value.trim();
            if (!handle) return;

            if (!accessToken) {
                alert('Для поиска каналов через API войдите в свой Google аккаунт!');
                return;
            }

            try {
                const cleanHandle = handle.replace('@', '');
                const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${cleanHandle}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    const ch = data.items[0];
                    showChannelData(
                        ch.snippet.title,
                        '@' + cleanHandle,
                        ch.snippet.thumbnails.default.url,
                        ch.statistics.subscriberCount,
                        ch.statistics.viewCount,
                        ch.statistics.videoCount
                    );
                    document.getElementById('revenueBlock').classList.add('hidden');
                } else {
                    alert('Канал не найден');
                }
            } catch (e) {
                alert('Ошибка поиска канала');
            }
        }
    </script>
</body>
</html>
